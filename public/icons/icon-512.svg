<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mueenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- الخلفية مع زوايا دائرية لشاشات الهاتف -->
  <rect width="512" height="512" rx="128" fill="url(#mueenGrad)"/>
  
  <!-- زخرفة دائرية داخلية -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- هلال إسلامي ونجمة ورمز العهد والالتزام -->
  <g filter="url(#shadow)">
    <!-- هلال ذهبي متدرج -->
    <path d="M290 140 C200 140 140 210 140 290 C140 370 205 425 285 425 C325 425 365 410 395 380 C310 395 220 330 220 250 C220 185 270 145 290 140 Z" fill="url(#goldGrad)"/>
    
    <!-- نجمة علوية متألقة -->
    <polygon points="340,170 348,188 368,188 352,200 358,218 340,206 322,218 328,200 312,188 332,188" fill="#fef3c7"/>
    
    <!-- رمز المحراب ونقطة النور -->
    <circle cx="340" cy="290" r="16" fill="#a7f3d0"/>
  </g>
</svg>
